services:
  laya:
    build:
      context: .
      args:
        # CPU avoids pulling CUDA libraries for the default POC image.
        TORCH_INDEX: ${TORCH_INDEX:-cpu}
    image: poc-laya:latest
    # Runtime configuration and secrets come from .env, never from the image.
    environment:
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in .env (see .env.example)}
      HF_HOME: ${HF_HOME:-/data/huggingface}
      HUGGINGFACE_HUB_CACHE: ${HUGGINGFACE_HUB_CACHE:-/data/huggingface/hub}
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      LAYA_PRELOAD: ${LAYA_PRELOAD:-1}
      USE_TF: ${USE_TF:-0}
      TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-false}
      PYTHONDONTWRITEBYTECODE: ${PYTHONDONTWRITEBYTECODE:-1}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
    ports:
      - "8000:8000"
    volumes:
      - laya-model-cache:/data/huggingface
      - ./ticket_triage_poc.py:/app/ticket_triage_poc.py:ro
    restart: unless-stopped

  watch:
    # Standalone development tool: it does not require rebuilding Laya's image.
    image: python:3.11-slim-bookworm
    profiles: ["watch"]
    working_dir: /app
    environment:
      # The watcher is a separate container, so it reaches Laya by service name.
      LAYA_URL: http://laya:8000
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./ticket_triage_poc.py:/app/ticket_triage_poc.py:ro
    command:
      - sh
      - -c
      - pip install --disable-pip-version-check --no-cache-dir watchfiles==1.3.0 && watchfiles --filter python "python /app/ticket_triage_poc.py" /app

volumes:
  laya-model-cache:
    name: laya-model-cache
